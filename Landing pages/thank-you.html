<style>

    --green:#004A2B; --green-dark:#003820; --gold:#AB8743; --gold-dark:#8b6d35;
    --cream:#FBF5EA; --cream-warm:#f4ecd6;
    --black:#171717; --muted:#6b6b6b; --hairline:#dccfa8;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Montserrat','Proxima Nova',Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:var(--sans); background-color:var(--cream);
    color:var(--black); line-height:1.55; min-height:100vh;
  }
  .page { max-width:560px; margin:0 auto; padding:0 20px 60px; text-align:center; }
  .trust-strip { background:var(--green); margin:0 -20px 32px; padding:11px 20px; }
  .trust-strip span { color:var(--gold); font-size:10px; letter-spacing:2.5px; font-weight:700; text-transform:uppercase; }
  .brand { font-family:var(--serif); font-size:22px; letter-spacing:9px; color:var(--black); font-weight:600; }
  .brand sup { font-size:11px; letter-spacing:0; }
  .brand-sub { font-size:9px; letter-spacing:5px; color:var(--muted); margin-top:6px; }
  .rule { width:48px; height:1px; background:var(--gold); margin:18px auto 28px; }

  h1 { font-family:var(--serif); font-size:32px; line-height:1.2; color:var(--green); font-weight:500; margin:0 0 10px; }
  .sub { font-size:15px; color:var(--muted); margin:0 0 8px; line-height:1.55; }

  /* Rating readout — matching mailer/private-feedback */
  .rating-readout { margin:22px 0 4px; line-height:1; }
  .rating-readout .num {
    font-family:var(--serif); font-size:32px; color:var(--green);
    font-weight:600; letter-spacing:1px;
  }
  .rating-readout .unit {
    font-family:var(--sans); font-size:11px; color:var(--muted);
    letter-spacing:2.5px; font-weight:600; text-transform:uppercase;
    margin-left:8px; vertical-align:middle;
  }

  .feedback-quote {
    background:var(--cream-warm); border:1px solid var(--hairline); border-left:3px solid var(--gold);
    padding:18px 22px; margin:24px 0 8px; text-align:left; border-radius:0 4px 4px 0;
  }
  .quote-label { font-size:10px; letter-spacing:2px; color:var(--gold); text-transform:uppercase; font-weight:700; margin-bottom:8px; }
  .quote-text { font-family:var(--serif); font-size:16px; color:var(--black); line-height:1.55; margin:0; font-style:italic; word-wrap:break-word; }

  .followup-note {
    font-size:13px; color:var(--black); background:#e8f0e8;
    border:1px solid #c5dac8; padding:14px 18px; border-radius:4px;
    margin:18px 0 0; line-height:1.5;
  }
  .followup-note strong { color:var(--green); }

  .divider { width:36px; height:1px; background:var(--hairline); margin:32px auto; }
  a.btn {
    display:inline-block; padding:14px 30px; background:var(--green); color:#fff;
    text-decoration:none; font-size:13px; letter-spacing:2px; text-transform:uppercase;
    border-radius:3px; font-weight:600;
  }
  a.btn:hover { background:var(--green-dark); }

  @media (max-width:480px) {
    .star { width:42px; height:42px; }
    .rating-readout .num { font-size:28px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="trust-strip"><span>♡ 250K+ 4.9★ Reviews · We Read Every One ♡</span></div>
  <div class="brand">VAHDAM<sup>®</sup></div>
  <div class="brand-sub">INDIA</div>
  <div class="rule"></div>

  <h1 id="heading">Got it. Thank you.</h1>
  <p class="sub" id="sub">A real person on our team will see this within the day.</p>

  <div class="stars-card" id="starsCard" style="display:none;">
    <div class="stars-label">— You Rated Us —</div>
    <div class="stars-row" id="starsRow">
      <div class="star"><div class="star-half star-half-l" data-rating="0.5"></div><div class="star-half star-half-r" data-rating="1"></div></div>
      <div class="star"><div class="star-half star-half-l" data-rating="1.5"></div><div class="star-half star-half-r" data-rating="2"></div></div>
      <div class="star"><div class="star-half star-half-l" data-rating="2.5"></div><div class="star-half star-half-r" data-rating="3"></div></div>
      <div class="star"><div class="star-half star-half-l" data-rating="3.5"></div><div class="star-half star-half-r" data-rating="4"></div></div>
      <div class="star"><div class="star-half star-half-l" data-rating="4.5"></div><div class="star-half star-half-r" data-rating="5"></div></div>
    </div>
    <div class="rating-readout">
      <span class="num" id="ratingValue">0</span><span class="unit">/ 5 Stars</span>
    </div>
  </div>

  <div class="feedback-quote" id="feedbackQuote" style="display:none;">
    <div class="quote-label">What you told us</div>
    <p class="quote-text" id="feedbackText"></p>
  </div>

  <div class="followup-note" id="followupNote" style="display:none;">
    <strong>Someone from our team will be in touch.</strong><br>
    <span id="followupChannel">Usually within a working day.</span>
  </div>

  <div class="divider"></div>
  <a class="btn" href="https://vahdam.com">Back to Vahdam</a>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const rating = parseFloat(params.get('rating') || '0');
  const feedback = (params.get('feedback') || '').trim();
  const name = (params.get('name') || '').trim();
  const followup = (params.get('followup') || '').trim();

  if (name) {
    document.getElementById('heading').textContent = 'Got it, ' + name + '. Thank you.';
  }
  if (rating > 0 && rating <= 5) {
    document.getElementById('starsCard').style.display = 'block';
    document.querySelectorAll('.star-half').forEach(h => {
      if (parseFloat(h.dataset.rating) <= rating) h.classList.add('filled');
    });
    document.getElementById('ratingValue').textContent = rating % 1 === 0 ? rating : rating.toFixed(1);
  }
  if (feedback) {
    document.getElementById('feedbackQuote').style.display = 'block';
    document.getElementById('feedbackText').textContent = '“' + feedback + '”';
  }
  if (followup && followup !== 'none') {
    document.getElementById('followupNote').style.display = 'block';
    if (followup === 'phone') {
      document.getElementById('followupChannel').textContent = 'We’ll call you within 1–2 working days.';
    } else if (followup === 'email') {
      document.getElementById('followupChannel').textContent = 'You’ll hear from us by email within 1–2 working days.';
    }
  } else if (rating > 0 && rating < 4) {
    document.getElementById('followupNote').style.display = 'block';
    document.getElementById('followupNote').innerHTML = '<strong>This goes to our team, not public reviews.</strong><br>We read every one — and learn from the rough notes most of all.';
  }
</script>
</body>
</html>
