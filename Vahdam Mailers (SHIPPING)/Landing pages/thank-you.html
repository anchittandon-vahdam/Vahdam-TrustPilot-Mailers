<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thanks — Vahdam</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --green:#004A2B; --gold:#AB8743; --black:#171717; --cream:#FBF5EA; --text:#171717; --muted:#6b6b6b; --hairline:#e5dfd0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Proxima Nova','Montserrat','Helvetica Neue',Arial,sans-serif; background:#f5f5f5; color:var(--text); }
  .page { max-width:520px; margin:0 auto; padding:64px 24px; text-align:center; }
  .brand { font-size:13px; letter-spacing:5px; color:var(--green); font-weight:700; }
  .rule { width:48px; height:1px; background:var(--gold); margin:14px auto 36px; }
  .card { background:#fff; border-radius:6px; padding:48px 32px; }
  h1 { font-family:'Lao MN','Lao Sangam MN','Cormorant Garamond',Georgia,serif; font-size:28px; color:var(--green); font-weight:600; margin:0 0 14px; }
  p { color:var(--muted); margin:0 0 28px; line-height:1.6; }
  a.btn { display:inline-block; padding:14px 30px; background:var(--green); color:#fff; text-decoration:none; font-size:13px; letter-spacing:2px; text-transform:uppercase; border-radius:2px; font-weight:600; }
</style>
</head>
<body>
<div class="page">
  <div class="brand">VAHDAM</div>
  <div class="rule"></div>
  <div class="card">
    <h1>Got it. Thank you.</h1>
    <p>Your rating's in. If you asked for someone to follow up, they will.</p>
    <a class="btn" href="https://vahdam.com">Back to Vahdam</a>
  </div>
</div>
</body>
</html>
